name: CI - Fast Checks (pre-commit)

on:
  pull_request:
    branches: [main]
    paths:
      - "Makefile"
      - "README.md"
      - "Vagrantfile"
      - ".pre-commit-config.yaml"
      - "config/**"
      - "scripts/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "README.md"
      - "Vagrantfile"
      - ".pre-commit-config.yaml"
      - "config/**"
      - "scripts/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-checks:
    runs-on: ubuntu-latest
