name: Security - SAST (Semgrep)

on:
  workflow_dispatch:
  schedule:
    - cron: "58 0 6 * *"  # monthly scattered (was: 0 11 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-semgrep.yml@ef5f76c297dba0d2990210a905d045c826092427 # v1.4.3
