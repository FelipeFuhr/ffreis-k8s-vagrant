name: Security - SCA/IaC (Snyk)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "2 23 26 * *"  # monthly scattered (was: 0 10 * * 1)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    if: ${{ secrets.SNYK_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js (for Snyk CLI)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: |
          set -euo pipefail
          npm install -g snyk
          snyk --version

      - name: Run Snyk Code
        id: snyk_code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p snyk-results
          snyk code test --sarif-file-output=snyk-results/code.sarif
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run Snyk IaC
        id: snyk_iac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          snyk iac test . --sarif-file-output=snyk-results/iac.sarif
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Snyk Code SARIF
        if: ${{ hashFiles('snyk-results/code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: snyk-results/code.sarif
          category: snyk-code

      - name: Upload Snyk IaC SARIF
        if: ${{ hashFiles('snyk-results/iac.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: snyk-results/iac.sarif
          category: snyk-iac

      - name: Enforce Snyk policy
        run: |
          set -euo pipefail
          code_rc="${{ steps.snyk_code.outputs.rc || '1' }}"
          iac_rc="${{ steps.snyk_iac.outputs.rc || '1' }}"
          if [ "${code_rc}" != "0" ] || [ "${iac_rc}" != "0" ]; then
            echo "Snyk policy failed: code_rc=${code_rc}, iac_rc=${iac_rc}" >&2
            exit 1
          fi
